name: Test Pull Request Build

on:
    workflow_dispatch:
    pull_request:
        branches:
            - "**"

jobs:
    build:
        strategy:
            fail-fast: false

            matrix:
                config:
                    - name: Windows
                      os: windows-latest
                      build-type: RelWithDebInfo

                    - name: macOS
                      os: macos-latest

                    - name: iOS
                      os: macos-latest
                      target: iOS

                    - name: Android32
                      os: ubuntu-latest
                      target: Android32

                    - name: Android64
                      os: ubuntu-latest
                      target: Android64

        name: ${{ matrix.config.name }}
        runs-on: ${{ matrix.config.os }}

        steps:
            - uses: actions/checkout@v6

            - name: Compile the mod
              uses: geode-sdk/build-geode-mod@main
              with:
                  combine: true
                  export-pdb: true
                  export-symbols: true
                  target: ${{ matrix.config.target }}
                  build-config: ${{ matrix.config.build-type || 'Release'}}

    package:
        name: Package Builds
        runs-on: ubuntu-latest
        needs: [ "build" ]

        steps:
            - uses: geode-sdk/build-geode-mod/combine@main
              id: build

            - uses: actions/upload-artifact@v7
              with:
                  name: build-output
                  path: ${{ steps.build.outputs.build-output }}/*
